<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">How physical priors enter diffusion model training</title>
  <desc id="desc">An entire trajectory or field is combined with noise and passed to a diffusion predictor to obtain a denoised estimate. Distributional priors guide symmetry and matching objectives; feasibility priors provide training losses. Sampling starts from Gaussian noise and generates a trajectory or field through iterative reverse diffusion.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#263833}
      .title{font-size:30px;font-weight:700}.label{font-size:18px;fill:#25766c;font-weight:700;letter-spacing:1px}
      .stage{font-size:22px;font-weight:700}.body{font-size:21px}.note{font-size:18px;fill:#60716b}.prior{font-size:24px;font-weight:700;fill:#25766c}
      .arrow{fill:none;stroke:#7b9c91;stroke-width:3;marker-end:url(#arrow)}
    .math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-weight:400}.math .var{font-style:italic}.math .sub{font-size:70%;baseline-shift:sub}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#7b9c91" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="660" fill="#fafbf8"/>
  <text x="60" y="55" class="label">TRAINING</text>
  <text x="185" y="57" class="title">Learn whole dynamics from noisy states with physical priors</text>

  <g text-anchor="middle">
    <rect x="60" y="100" width="270" height="172" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="195" y="136" class="label">DATA + PERTURBATION</text>
    <text x="195" y="181" class="stage">Full trajectory / field <tspan class="math"><tspan class="var">x</tspan><tspan class="sub">0</tspan></tspan></text>
    <text x="195" y="218" class="body">Add random noise</text>
    <text x="195" y="247" class="note">Diffusion time <tspan class="math"><tspan class="var">t</tspan></tspan></text>

    <rect x="410" y="100" width="270" height="172" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="545" y="136" class="label">MODEL INPUT</text>
    <text x="545" y="190" class="stage">Noisy state <tspan class="math"><tspan class="var">x</tspan><tspan class="sub var">t</tspan></tspan></text>
    <text x="545" y="233" class="note">Perturb the whole sample</text>

    <rect x="760" y="100" width="270" height="172" rx="10" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="895" y="136" class="label">LEARNABLE MAPPING</text>
    <text x="895" y="190" class="stage">Diffusion predictor</text>
    <text x="895" y="233" class="note">Use state + diffusion time</text>

    <rect x="1110" y="100" width="270" height="172" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="1245" y="136" class="label">CLEAN PREDICTION</text>
    <text x="1245" y="190" class="stage">Clean-sample estimate</text>
    <text x="1245" y="233" class="note">For matching + physics loss</text>
  </g>
  <path d="M345 186 H394" class="arrow"/>
  <path d="M695 186 H744" class="arrow"/>
  <path d="M1045 186 H1094" class="arrow"/>

  <rect x="60" y="310" width="1320" height="94" rx="9" fill="#edf5ef"/>
  <path d="M330 330 V384" stroke="#bad0c5" stroke-width="2"/>
  <text x="84" y="350" class="prior">Distributional priors</text>
  <text x="84" y="380" class="note">Symmetry + matching</text>
  <text x="362" y="349" class="body">Use translation and rotation symmetries in design; choose noise or data matching from priors.</text>
  <text x="362" y="382" class="note">Shape how the model learns a distribution, aligning generation with the system's structure.</text>

  <rect x="60" y="422" width="1320" height="100" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
  <path d="M330 442 V502" stroke="#d5dfd9" stroke-width="2"/>
  <text x="84" y="462" class="prior">Feasibility priors</text>
  <text x="84" y="493" class="note">Act on the training loss</text>
  <text x="362" y="461" class="body">Apply physical objectives to denoised estimates: momentum, energy-related quantities, or PDE residuals.</text>
  <text x="362" y="495" class="note">The loss depends on the system and the structure of the constraint.</text>

  <text x="60" y="601" class="label">SAMPLING</text>
  <g text-anchor="middle">
    <rect x="180" y="558" width="280" height="72" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="602" class="body">Gaussian noise</text>
    <rect x="610" y="558" width="330" height="72" rx="9" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="775" y="602" class="body">Iterative reverse diffusion</text>
    <rect x="1090" y="558" width="290" height="72" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="1235" y="602" class="body">Generated trajectory / field</text>
  </g>
  <path d="M478 594 H592" class="arrow"/>
  <path d="M958 594 H1072" class="arrow"/>
</svg>
