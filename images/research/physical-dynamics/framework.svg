<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc">
  <title id="title">物理先验如何参与扩散模型训练</title>
  <desc id="desc">完整轨迹或场与噪声组成带噪输入，经扩散预测器得到去噪估计。分布先验影响对称性与匹配目标，可行性先验提供训练损失。采样从高斯噪声出发，经迭代反向扩散生成轨迹或场。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263833}
      .title{font-size:30px;font-weight:700}.label{font-size:18px;fill:#25766c;font-weight:700;letter-spacing:1px}
      .stage{font-size:25px;font-weight:700}.body{font-size:21px}.note{font-size:18px;fill:#60716b}.prior{font-size:24px;font-weight:700;fill:#25766c}
      .arrow{fill:none;stroke:#7b9c91;stroke-width:3;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#7b9c91" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1440" height="660" fill="#fafbf8"/>
  <text x="60" y="55" class="label">训练</text>
  <text x="132" y="57" class="title">从带噪状态学习完整动力学，让物理先验参与训练</text>

  <g text-anchor="middle">
    <rect x="60" y="100" width="270" height="172" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="195" y="136" class="label">数据与扰动</text>
    <text x="195" y="181" class="stage">完整轨迹 / 场 x₀</text>
    <text x="195" y="218" class="body">加入随机噪声</text>
    <text x="195" y="247" class="note">扩散时间 t</text>

    <rect x="410" y="100" width="270" height="172" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="545" y="136" class="label">模型输入</text>
    <text x="545" y="190" class="stage">带噪状态 xₜ</text>
    <text x="545" y="233" class="note">整个动力学样本的扰动</text>

    <rect x="760" y="100" width="270" height="172" rx="10" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="895" y="136" class="label">可学习的映射</text>
    <text x="895" y="190" class="stage">扩散预测器</text>
    <text x="895" y="233" class="note">结合状态与扩散时间</text>

    <rect x="1110" y="100" width="270" height="172" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="1245" y="136" class="label">干净样本预测</text>
    <text x="1245" y="190" class="stage">干净样本估计</text>
    <text x="1245" y="233" class="note">用于匹配目标与物理损失</text>
  </g>
  <path d="M345 186 H394" class="arrow"/>
  <path d="M695 186 H744" class="arrow"/>
  <path d="M1045 186 H1094" class="arrow"/>

  <rect x="60" y="310" width="1320" height="94" rx="9" fill="#edf5ef"/>
  <path d="M330 330 V384" stroke="#bad0c5" stroke-width="2"/>
  <text x="84" y="350" class="prior">分布先验</text>
  <text x="84" y="380" class="note">对称性与匹配目标</text>
  <text x="362" y="349" class="body">用平移、旋转等对称性指导模型设计，并按先验选择噪声匹配或数据匹配。</text>
  <text x="362" y="382" class="note">约束模型如何学习分布，让生成机制与系统的结构相协调。</text>

  <rect x="60" y="422" width="1320" height="100" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
  <path d="M330 442 V502" stroke="#d5dfd9" stroke-width="2"/>
  <text x="84" y="462" class="prior">可行性先验</text>
  <text x="84" y="493" class="note">作用位置：训练损失</text>
  <text x="362" y="461" class="body">对去噪估计施加物理训练目标：动量、能量相关量或 PDE 残差。</text>
  <text x="362" y="495" class="note">具体损失形式由系统与约束结构决定。</text>

  <text x="60" y="601" class="label">采样</text>
  <g text-anchor="middle">
    <rect x="180" y="558" width="280" height="72" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="602" class="body">高斯噪声</text>
    <rect x="610" y="558" width="330" height="72" rx="9" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="775" y="602" class="body">迭代反向扩散</text>
    <rect x="1090" y="558" width="290" height="72" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="1235" y="602" class="body">生成轨迹 / 场</text>
  </g>
  <path d="M478 594 H592" class="arrow"/>
  <path d="M958 594 H1072" class="arrow"/>
</svg>
