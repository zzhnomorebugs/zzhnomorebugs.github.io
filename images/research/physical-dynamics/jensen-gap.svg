<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">可行样本的均值，未必仍然可行</title>
  <desc id="desc">单位圆上的两个点 a 等于负一、零，b 等于一、零，均满足平方范数等于一。它们等权重的条件均值位于原点，平方范数为零。因此对于约束 R(x) 等于平方范数减一，两个样本的残差为零，均值的残差为负一。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263833}.title{font-size:32px;font-weight:700}
      .label{font-size:22px;font-weight:700}.body{font-size:23px}.note{font-size:20px;fill:#60716b}.accent{fill:#25766c}.formula{font-size:29px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#fafbf8"/>
  <text x="48" y="56" class="title">可行样本的均值，未必仍然可行</text>
  <text x="48" y="91" class="note">一个非线性约束的二维示例</text>

  <circle cx="310" cy="283" r="151" fill="#edf5ef" stroke="#25766c" stroke-width="3"/>
  <path d="M117 283 H503 M310 112 V454" fill="none" stroke="#ccd9d1" stroke-width="2"/>
  <path d="M159 283 H461" fill="none" stroke="#8eaaa0" stroke-width="3" stroke-dasharray="7 7"/>
  <circle cx="159" cy="283" r="8" fill="#25766c" stroke="#fff" stroke-width="3"/>
  <circle cx="461" cy="283" r="8" fill="#25766c" stroke="#fff" stroke-width="3"/>
  <circle cx="310" cy="283" r="9" fill="#b77545" stroke="#fff" stroke-width="3"/>
  <text x="65" y="235" class="label">a = (−1, 0)</text>
  <text x="65" y="263" class="note">‖a‖² = 1</text>
  <text x="468" y="235" class="label">b = (1, 0)</text>
  <text x="468" y="263" class="note">‖b‖² = 1</text>
  <text x="310" y="324" text-anchor="middle" class="label">均值 = (0, 0)</text>
  <text x="310" y="355" text-anchor="middle" class="note">‖(a + b) / 2‖² = 0</text>
  <text x="310" y="468" text-anchor="middle" class="note">圆周：满足约束的样本集合</text>

  <rect x="657" y="126" width="495" height="324" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
  <text x="687" y="169" class="label accent">约束函数</text>
  <text x="687" y="214" class="formula">R(x) = ‖x‖² − 1</text>
  <path d="M687 238 H1122" stroke="#d5dfd9" stroke-width="2"/>
  <text x="687" y="279" class="body">两个样本均可行：</text>
  <text x="687" y="318" class="formula accent">R(a) = R(b) = 0</text>
  <text x="687" y="367" class="body">等权条件均值却偏离约束：</text>
  <text x="687" y="411" class="formula">R((a + b) / 2) = −1</text>
</svg>
