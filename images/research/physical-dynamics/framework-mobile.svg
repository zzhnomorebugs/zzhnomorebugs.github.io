<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">物理先验如何参与扩散模型训练，手机排版</title>
  <desc id="desc">完整轨迹或场加噪后输入扩散预测器，获得去噪估计。分布先验指导对称性与匹配目标；可行性先验作用于训练损失。采样是从高斯噪声开始的迭代反向扩散。</desc>
  <defs>
    <style>
      text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#263833}
      .title{font-size:28px;font-weight:700}.label{font-size:19px;fill:#25766c;font-weight:700}.stage{font-size:26px;font-weight:700}
      .body{font-size:22px}.note{font-size:19px;fill:#60716b}.prior{font-size:24px;font-weight:700;fill:#25766c}
      .arrow{fill:none;stroke:#7b9c91;stroke-width:3;marker-end:url(#arrow)}
    .math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-weight:400}.math .var{font-style:italic}.math .sub{font-size:70%;baseline-shift:sub}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#7b9c91" stroke-width="1.5"/></marker>
  </defs>
  <rect width="640" height="1080" fill="#fafbf8"/>
  <text x="40" y="45" class="label">训练</text>
  <text x="105" y="47" class="title">让物理先验参与动力学生成</text>
  <g text-anchor="middle">
    <rect x="60" y="88" width="520" height="110" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="128" class="stage">完整轨迹 / 场 <tspan class="math"><tspan class="var">x</tspan><tspan class="sub">0</tspan></tspan> + 随机噪声</text>
    <text x="320" y="171" class="note">在扩散时间 <tspan class="math"><tspan class="var">t</tspan></tspan> 构造带噪样本</text>
    <rect x="60" y="234" width="520" height="86" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="286" class="stage">带噪状态 <tspan class="math"><tspan class="var">x</tspan><tspan class="sub var">t</tspan></tspan></text>
    <rect x="60" y="356" width="520" height="110" rx="10" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="320" y="397" class="stage">扩散预测器</text>
    <text x="320" y="439" class="note">结合带噪状态与扩散时间</text>
    <rect x="60" y="502" width="520" height="86" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="554" class="stage">干净样本估计</text>
  </g>
  <path d="M320 205 V224" class="arrow"/>
  <path d="M320 327 V346" class="arrow"/>
  <path d="M320 473 V492" class="arrow"/>

  <rect x="40" y="618" width="560" height="132" rx="9" fill="#edf5ef"/>
  <text x="62" y="653" class="prior">分布先验 · 对称性与匹配目标</text>
  <text x="62" y="690" class="body">用平移、旋转等对称性指导模型设计，</text>
  <text x="62" y="722" class="body">按先验选择噪声匹配或数据匹配。</text>

  <rect x="40" y="772" width="560" height="140" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
  <text x="62" y="808" class="prior">可行性先验 · 作用于训练损失</text>
  <text x="62" y="845" class="body">对去噪估计计算动量、能量相关量，</text>
  <text x="62" y="877" class="body">或 PDE 残差等物理训练目标。</text>

  <text x="40" y="950" class="label">采样</text>
  <g text-anchor="middle">
    <rect x="40" y="973" width="152" height="73" rx="8" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="116" y="1017" class="body">高斯噪声</text>
    <rect x="240" y="973" width="160" height="73" rx="8" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="320" y="1005" class="body">迭代</text>
    <text x="320" y="1033" class="body">反向扩散</text>
    <rect x="448" y="973" width="152" height="73" rx="8" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="524" y="1005" class="body">生成</text>
    <text x="524" y="1033" class="body">轨迹 / 场</text>
  </g>
  <path d="M200 1010 H228" class="arrow"/>
  <path d="M408 1010 H436" class="arrow"/>
</svg>
