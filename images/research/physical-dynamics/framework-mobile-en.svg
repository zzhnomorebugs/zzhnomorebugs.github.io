<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1080" viewBox="0 0 640 1080" role="img" aria-labelledby="title desc">
  <title id="title">How physical priors enter diffusion model training, mobile layout</title>
  <desc id="desc">An entire trajectory or field is noised and passed to a diffusion predictor to obtain a denoised estimate. Distributional priors guide symmetry and matching objectives; feasibility priors act on the training loss. Sampling is iterative reverse diffusion starting from Gaussian noise.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#263833}
      .title{font-size:25px;font-weight:700}.label{font-size:19px;fill:#25766c;font-weight:700}.stage{font-size:26px;font-weight:700}
      .body{font-size:22px}.note{font-size:19px;fill:#60716b}.prior{font-size:23px;font-weight:700;fill:#25766c}
      .arrow{fill:none;stroke:#7b9c91;stroke-width:3;marker-end:url(#arrow)}
    .math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-weight:400}.math .var{font-style:italic}.math .sub{font-size:70%;baseline-shift:sub}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#7b9c91" stroke-width="1.5"/></marker>
  </defs>
  <rect width="640" height="1080" fill="#fafbf8"/>
  <text x="40" y="45" class="label">TRAINING</text>
  <text x="150" y="47" class="title">Physical priors for dynamics</text>
  <g text-anchor="middle">
    <rect x="60" y="88" width="520" height="110" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="128" class="stage">Full trajectory / field <tspan class="math"><tspan class="var">x</tspan><tspan class="sub">0</tspan></tspan> + random noise</text>
    <text x="320" y="171" class="note">Construct a noisy sample at diffusion time <tspan class="math"><tspan class="var">t</tspan></tspan></text>
    <rect x="60" y="234" width="520" height="86" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="286" class="stage">Noisy state <tspan class="math"><tspan class="var">x</tspan><tspan class="sub var">t</tspan></tspan></text>
    <rect x="60" y="356" width="520" height="110" rx="10" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="320" y="397" class="stage">Diffusion predictor</text>
    <text x="320" y="439" class="note">Use the noisy state and diffusion time</text>
    <rect x="60" y="502" width="520" height="86" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="320" y="554" class="stage">Clean-sample estimate</text>
  </g>
  <path d="M320 205 V224" class="arrow"/>
  <path d="M320 327 V346" class="arrow"/>
  <path d="M320 473 V492" class="arrow"/>

  <rect x="40" y="618" width="560" height="132" rx="9" fill="#edf5ef"/>
  <text x="62" y="653" class="prior">Distributional priors · symmetry + matching</text>
  <text x="62" y="690" class="body">Use translation and rotation symmetries in design;</text>
  <text x="62" y="722" class="body">choose noise or data matching based on priors.</text>

  <rect x="40" y="772" width="560" height="140" rx="9" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
  <text x="62" y="808" class="prior">Feasibility priors · act on the training loss</text>
  <text x="62" y="845" class="body">Physical objectives on denoised estimates:</text>
  <text x="62" y="877" class="body">momentum, energy quantities, or PDE residuals.</text>

  <text x="40" y="950" class="label">SAMPLING</text>
  <g text-anchor="middle">
    <rect x="40" y="973" width="152" height="73" rx="8" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="116" y="1017" class="body" style="font-size:20px">Gaussian noise</text>
    <rect x="240" y="973" width="160" height="73" rx="8" fill="#edf5ef" stroke="#25766c" stroke-width="2"/>
    <text x="320" y="1005" class="body" style="font-size:19px">Iterative reverse</text>
    <text x="320" y="1033" class="body">diffusion</text>
    <rect x="448" y="973" width="152" height="73" rx="8" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
    <text x="524" y="1005" class="body">Generated</text>
    <text x="524" y="1033" class="body" style="font-size:19px">trajectory / field</text>
  </g>
  <path d="M200 1010 H228" class="arrow"/>
  <path d="M408 1010 H436" class="arrow"/>
</svg>
