<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">The mean of feasible samples need not remain feasible</title>
  <desc id="desc">On the unit circle, a = (−1, 0) and b = (1, 0) both have squared norm one. Their equally weighted conditional mean is the origin, with squared norm zero. For the constraint R(x) = squared norm minus one, both samples have zero residual, while the mean has residual minus one.</desc>
  <defs>
    <style>
      text{font-family:Arial,sans-serif;fill:#263833}.title{font-size:32px;font-weight:700}
      .label{font-size:22px;font-weight:700}.body{font-size:23px}.note{font-size:20px;fill:#60716b}.accent{fill:#25766c}.formula{font-size:29px;font-weight:700}
    .math{font-family:"Cambria Math","STIX Two Math","Times New Roman",serif;font-weight:400}.math .var{font-style:italic}.math .sup{font-size:70%;baseline-shift:super}
    </style>
  </defs>
  <rect width="1200" height="500" fill="#fafbf8"/>
  <text x="48" y="56" class="title">The mean of feasible samples need not remain feasible</text>
  <text x="48" y="91" class="note">A two-dimensional example of a nonlinear constraint</text>

  <circle cx="310" cy="283" r="151" fill="#edf5ef" stroke="#25766c" stroke-width="3"/>
  <path d="M117 283 H503 M310 112 V454" fill="none" stroke="#ccd9d1" stroke-width="2"/>
  <path d="M159 283 H461" fill="none" stroke="#8eaaa0" stroke-width="3" stroke-dasharray="7 7"/>
  <circle cx="159" cy="283" r="8" fill="#25766c" stroke="#fff" stroke-width="3"/>
  <circle cx="461" cy="283" r="8" fill="#25766c" stroke="#fff" stroke-width="3"/>
  <circle cx="310" cy="283" r="9" fill="#b77545" stroke="#fff" stroke-width="3"/>
  <text x="65" y="235" class="label math"><tspan class="var">a</tspan> = (−1, 0)</text>
  <text x="65" y="263" class="note math">‖<tspan class="var">a</tspan>‖<tspan class="sup">2</tspan> = 1</text>
  <text x="468" y="235" class="label math"><tspan class="var">b</tspan> = (1, 0)</text>
  <text x="468" y="263" class="note math">‖<tspan class="var">b</tspan>‖<tspan class="sup">2</tspan> = 1</text>
  <text x="310" y="324" text-anchor="middle" class="label">Mean = (0, 0)</text>
  <text x="310" y="355" text-anchor="middle" class="note math">‖(<tspan class="var">a</tspan> + <tspan class="var">b</tspan>) / 2‖<tspan class="sup">2</tspan> = 0</text>
  <text x="310" y="468" text-anchor="middle" class="note">Circle: the set of feasible samples</text>

  <rect x="657" y="126" width="495" height="324" rx="10" fill="#fff" stroke="#d5dfd9" stroke-width="2"/>
  <text x="687" y="169" class="label accent">Constraint function</text>
  <text x="687" y="214" class="formula math"><tspan class="var">R</tspan>(<tspan class="var">x</tspan>) = ‖<tspan class="var">x</tspan>‖<tspan class="sup">2</tspan> − 1</text>
  <path d="M687 238 H1122" stroke="#d5dfd9" stroke-width="2"/>
  <text x="687" y="279" class="body">Both samples are feasible:</text>
  <text x="687" y="318" class="formula accent math"><tspan class="var">R</tspan>(<tspan class="var">a</tspan>) = <tspan class="var">R</tspan>(<tspan class="var">b</tspan>) = 0</text>
  <text x="687" y="367" class="body">The equal-weight mean violates it:</text>
  <text x="687" y="411" class="formula math"><tspan class="var">R</tspan>((<tspan class="var">a</tspan> + <tspan class="var">b</tspan>) / 2) = −1</text>
</svg>
