<svg xmlns="http://www.w3.org/2000/svg" width="520" height="950" viewBox="0 0 520 950" role="img" aria-labelledby="title desc">
  <title id="title">How the Fourier neural operator advances the concentration fields</title>
  <desc id="desc">During training, the FNO rolls forward from the initial state and compares the full trajectories of the bulk fluid, particle-pore and adsorbed-phase concentrations with COMSOL reference fields. For prediction, the same learned operator takes the current concentration grid, physical parameters and experimental conditions at every step. Read the fluid concentration at the column outlet over time to obtain the chromatogram.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #21374a; }
      .stage { font-size: 27px; font-weight: 700; fill: #116b62; }
      .heading { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; fill: #495f6d; }
      .note { font-size: 21px; fill: #116b62; }
      .card { fill: #fff; stroke: #cbd9dc; stroke-width: 1.5; }
      .model { fill: #deefea; stroke: #74a9a0; stroke-width: 1.5; }
      .link { fill: none; stroke: #577c7f; stroke-width: 2.5; marker-end: url(#arrow); }
      .repeat { stroke-dasharray: 5 5; }
      .icon { fill: none; stroke: #116b62; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#577c7f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="field" viewBox="0 0 56 56">
      <path class="icon" d="M12 9 H49 V36 M7 14 H44 V41" opacity=".65"/>
      <rect class="icon" x="2" y="19" width="37" height="27" rx="4"/>
      <path d="M3 31 C13 31 14 23 23 23 C29 23 30 30 38 31 V41 Q38 45 34 45 H7 Q3 45 3 41 Z" fill="#c4e4dc"/>
      <path class="icon" d="M3 36 C11 36 15 29 22 29 S31 35 38 36"/>
    </symbol>
    <symbol id="compare" viewBox="0 0 56 56">
      <path class="icon" d="M9 8 V47 H50" opacity=".65"/>
      <path class="icon" d="M12 39 C18 39 20 18 27 18 S35 38 47 39"/>
      <path class="icon" d="M12 42 C24 41 25 14 32 14 S41 41 48 42" stroke-dasharray="4 4" opacity=".72"/>
    </symbol>
    <symbol id="spectral" viewBox="0 0 56 56">
      <path class="icon" d="M5 16 C11 4 17 4 23 16 S35 28 41 16 S49 10 51 16 M5 30 C9 22 13 22 17 30 S25 38 29 30 S37 22 41 30 S49 38 51 30 M5 44 H51"/>
    </symbol>
    <symbol id="grid" viewBox="0 0 56 56">
      <rect x="5" y="13" width="46" height="30" rx="4" fill="#e4f3ef"/>
      <path d="M20 14 H35 V42 H20Z" fill="#a4d2c6"/>
      <path class="icon" d="M20 14 V42 M35 14 V42 M5 23 H51 M5 33 H51" opacity=".65"/>
      <rect class="icon" x="5" y="13" width="46" height="30" rx="4"/>
    </symbol>
  </defs>

  <rect width="520" height="950" fill="#fafbf9"/>
  <rect x="20" y="20" width="480" height="362" rx="16" fill="#f0f4f6"/>
  <rect x="20" y="414" width="480" height="516" rx="16" fill="#edf6f3"/>
  <text x="46" y="65" class="stage">Offline training</text>
  <text x="46" y="462" class="stage">Stepwise prediction</text>

  <rect x="46" y="85" width="428" height="166" rx="12" class="card"/>
  <path d="M65 169 H455" stroke="#dce6e7" stroke-width="1.5"/>
  <use href="#field" x="67" y="99" width="56" height="56"/>
  <text x="141" y="122" class="heading">COMSOL runs</text>
  <text x="141" y="151" class="body">Reference fields across conditions</text>
  <use href="#compare" x="67" y="182" width="56" height="56"/>
  <text x="141" y="203" class="heading">Trajectory loss</text>
  <text x="141" y="232" class="body">Compare three fields at each step</text>

  <path d="M260 258 V276" class="link"/>
  <rect x="46" y="284" width="428" height="77" rx="12" class="model"/>
  <use href="#spectral" x="67" y="294" width="56" height="56"/>
  <text x="141" y="316" class="heading">Train FNO</text>
  <text x="141" y="346" class="body">Roll out and fit the full trajectory</text>

  <rect x="46" y="486" width="400" height="94" rx="12" class="card"/>
  <use href="#grid" x="67" y="505" width="56" height="56"/>
  <text x="141" y="525" class="heading">Current state</text>
  <text x="141" y="555" class="body">Grid, parameters, settings</text>

  <path d="M246 587 V606" class="link"/>
  <rect x="46" y="614" width="400" height="90" rx="12" class="model"/>
  <use href="#spectral" x="67" y="631" width="56" height="56"/>
  <text x="141" y="651" class="heading">FNO step</text>
  <text x="141" y="681" class="body">Mix features in Fourier space</text>

  <path d="M246 711 V730" class="link"/>
  <rect x="46" y="738" width="400" height="96" rx="12" class="card"/>
  <use href="#grid" x="67" y="758" width="56" height="56"/>
  <text x="141" y="777" class="heading">Next state</text>
  <text x="141" y="807" class="body">Updated concentration grid</text>
  <path d="M452 786 H463 Q479 786 479 770 V549 Q479 533 463 533 H453" class="link repeat"/>
  <text x="260" y="872" class="note" text-anchor="middle">Feed the new state back into the same model</text>
  <text x="260" y="907" class="note" text-anchor="middle">Read outlet fluid concentration over time</text>
</svg>
