<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="524" viewBox="0 0 1120 524" role="img" aria-labelledby="title desc">
  <title id="title">How the physics-informed neural network speeds up forward solves</title>
  <desc id="desc">The PINN learns from finite-element reference concentration fields across physical parameters and gradient programs, with equation, initial and boundary residuals in the loss. For prediction, fixed network weights map experimental conditions, parameters, and a time and location to concentrations. Read the outlet over time to obtain the chromatogram.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #21374a; }
      .stage { font-size: 22px; font-weight: 700; fill: #116b62; }
      .heading { font-size: 22px; font-weight: 700; }
      .body { font-size: 17px; fill: #495f6d; }
      .note { font-size: 16px; fill: #116b62; }
      .card { fill: #fff; stroke: #cbd9dc; stroke-width: 1.5; }
      .model { fill: #deefea; stroke: #74a9a0; stroke-width: 1.5; }
      .link { fill: none; stroke: #577c7f; stroke-width: 2.5; marker-end: url(#arrow); }
      .icon { fill: none; stroke: #116b62; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #f7fcfa; stroke: #116b62; stroke-width: 2.5; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1 L6 4 L1 7" fill="none" stroke="#577c7f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <symbol id="field" viewBox="0 0 56 56">
      <path class="icon" d="M12 9 H49 V36 M7 14 H44 V41" opacity=".65"/>
      <rect class="icon" x="2" y="19" width="37" height="27" rx="4"/>
      <path d="M3 31 C13 31 14 23 23 23 C29 23 30 30 38 31 V41 Q38 45 34 45 H7 Q3 45 3 41 Z" fill="#c4e4dc"/>
      <path class="icon" d="M3 36 C11 36 15 29 22 29 S31 35 38 36"/>
    </symbol>
    <symbol id="residual" viewBox="0 0 56 56">
      <rect class="icon" x="9" y="7" width="38" height="42" rx="6"/>
      <path class="icon" d="M17 19 L19 21 L23 16 M17 29 L19 31 L23 26 M17 39 L19 41 L23 36 M29 19 H39 M29 29 H39 M29 39 H39"/>
    </symbol>
    <symbol id="network" viewBox="0 0 56 56">
      <path class="icon" d="M9 16 L28 12 M9 16 L28 28 M9 40 L28 28 M9 40 L28 44 M28 12 L47 28 M28 28 H47 M28 44 L47 28" opacity=".65"/>
      <g class="dot"><circle cx="9" cy="16" r="4"/><circle cx="9" cy="40" r="4"/><circle cx="28" cy="12" r="4"/><circle cx="28" cy="28" r="4"/><circle cx="28" cy="44" r="4"/><circle cx="47" cy="28" r="4"/></g>
    </symbol>
    <symbol id="query" viewBox="0 0 56 56">
      <path class="icon" d="M6 14 H50 M6 28 H50 M6 42 H50"/>
      <g class="dot"><circle cx="19" cy="14" r="5"/><circle cx="37" cy="28" r="5"/><circle cx="24" cy="42" r="5"/></g>
    </symbol>
    <symbol id="curve" viewBox="0 0 56 56">
      <path class="icon" d="M7 9 V46 H51" opacity=".65"/>
      <path class="icon" d="M11 40 H17 C24 40 25 14 31 14 C37 14 37 40 45 40 H49"/>
    </symbol>
  </defs>

  <rect width="1120" height="524" fill="#fafbf9"/>
  <rect x="24" y="20" width="1072" height="220" rx="16" fill="#f0f4f6"/>
  <rect x="24" y="284" width="1072" height="220" rx="16" fill="#edf6f3"/>
  <text x="56" y="60" class="stage">Offline training</text>
  <text x="56" y="324" class="stage">Fast forward queries</text>
  <text x="1064" y="324" class="note" text-anchor="end">Direct network evaluation replaces repeated finite-element solves</text>

  <rect x="56" y="83" width="266" height="126" rx="12" class="card"/>
  <use href="#field" x="73" y="118" width="56" height="56"/>
  <text x="145" y="130" class="heading">COMSOL runs</text>
  <text x="145" y="160" class="body">Reference fields</text>
  <text x="145" y="184" class="body">across conditions</text>

  <rect x="427" y="83" width="266" height="126" rx="12" class="model"/>
  <use href="#network" x="449" y="118" width="56" height="56"/>
  <text x="522" y="130" class="heading">Train PINN</text>
  <text x="522" y="160" class="body">Update weights from</text>
  <text x="522" y="184" class="body">data and physics loss</text>

  <rect x="798" y="83" width="266" height="126" rx="12" class="card"/>
  <use href="#residual" x="816" y="118" width="56" height="56"/>
  <text x="890" y="130" class="heading">Physics loss</text>
  <text x="890" y="160" class="body">Equation, initial and</text>
  <text x="890" y="184" class="body">boundary residuals</text>

  <path d="M335 146 H414" class="link"/>
  <path d="M785 146 H706" class="link"/>
  <path d="M560 220 V334" class="link"/>
  <text x="579" y="268" class="note">Reuse trained weights</text>

  <rect x="56" y="346" width="266" height="126" rx="12" class="card"/>
  <use href="#query" x="73" y="381" width="56" height="56"/>
  <text x="145" y="393" class="heading">Query inputs</text>
  <text x="145" y="423" class="body">Parameters, settings,</text>
  <text x="145" y="447" class="body">time and location</text>

  <rect x="427" y="346" width="266" height="126" rx="12" class="model"/>
  <use href="#network" x="449" y="381" width="56" height="56"/>
  <text x="522" y="393" class="heading">Frozen PINN</text>
  <text x="522" y="423" class="body">Evaluate the network</text>

  <rect x="798" y="346" width="266" height="126" rx="12" class="card"/>
  <use href="#curve" x="816" y="381" width="56" height="56"/>
  <text x="890" y="393" class="heading">Concentrations</text>
  <text x="890" y="423" class="body">Read the outlet</text>
  <text x="890" y="447" class="body">over time for a trace</text>

  <path d="M335 409 H414" class="link"/>
  <path d="M706 409 H785" class="link"/>
</svg>
