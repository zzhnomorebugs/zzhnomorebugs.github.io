<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1300" viewBox="0 0 640 1300" role="img" aria-labelledby="title desc">
  <title id="title">蛋白质序列可控生成的方法总览，竖版</title>
  <desc id="desc">通用序列先验、参考蛋白上下文与目标性质共同支持条件序列生成。生成候选序列后，独立检查条件遵循、序列编辑行为与结构合理性。本图不展示真实蛋白序列、模型规格或实验指标。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#25766c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#213b36} .title{font-size:34px;font-weight:700} .sub{font-size:24px;fill:#60756f} .label{font-size:23px;font-weight:600;fill:#25766c} .heading{font-size:30px;font-weight:700} .body{font-size:25px;fill:#536d65} .small{font-size:24px;fill:#536d65} .center{text-anchor:middle} .card{fill:#fff;stroke:#d3e2dd;stroke-width:2} .line{fill:none;stroke:#25766c;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <rect width="640" height="1300" fill="#fff"/>
  <text x="40" y="58" class="title">从蛋白质先验出发</text>
  <text x="40" y="104" class="title">生成目标条件下的候选序列</text>

  <rect x="40" y="147" width="560" height="371" rx="16" class="card"/>
  <rect x="40" y="147" width="8" height="371" rx="4" fill="#25766c"/>
  <text x="72" y="193" class="label">通用知识</text>
  <text x="72" y="234" class="heading">蛋白质序列先验</text>
  <text x="72" y="269" class="body">学习序列的统计规律</text>
  <path d="M72 290 H568" stroke="#e0e9e4" stroke-width="2"/>
  <text x="72" y="330" class="heading">野生型 / 参考蛋白</text>
  <text x="72" y="367" class="body">提供相对编辑的条件</text>
  <path d="M72 389 H568" stroke="#e0e9e4" stroke-width="2"/>
  <text x="72" y="432" class="heading">功能或性质条件</text>
  <text x="72" y="471" class="body">表达希望改变的方向</text>
  <path d="M320 518 V560" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="577" width="560" height="175" rx="18" fill="#f2f8f5" stroke="#9ebdb3" stroke-width="2"/>
  <text x="320" y="623" class="label center">离散序列生成</text>
  <text x="320" y="670" class="heading center">条件生成网络</text>
  <text x="320" y="713" class="body center">融合先验、上下文与条件</text>
  <path d="M320 752 V795" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="812" width="560" height="162" rx="16" class="card"/>
  <text x="320" y="861" class="heading center">候选蛋白质序列</text>
  <text x="320" y="902" class="body center">在参考上下文中探索变体</text>
  <g transform="translate(167 926)">
    <rect x="0" width="306" height="18" rx="6" fill="#edf3ef"/>
    <g fill="#a4cabb"><rect x="12" y="4" width="42" height="10" rx="3"/><rect x="67" y="4" width="42" height="10" rx="3"/><rect x="122" y="4" width="42" height="10" rx="3"/><rect x="177" y="4" width="42" height="10" rx="3"/><rect x="232" y="4" width="61" height="10" rx="3"/></g>
    <rect x="122" y="4" width="42" height="10" rx="3" fill="#25766c"/>
  </g>
  <path d="M320 974 V1017" class="line" marker-end="url(#arrow)"/>

  <rect x="40" y="1034" width="560" height="149" rx="16" fill="#eff7f4" stroke="#b8d1c7" stroke-width="2"/>
  <text x="320" y="1082" class="heading center">独立评价</text>
  <text x="320" y="1125" class="body center">条件遵循 · 编辑行为</text>
  <text x="320" y="1160" class="body center">序列与结构合理性</text>

  <text x="40" y="1232" class="sub">生成提出候选，独立评价检验</text>
  <text x="40" y="1269" class="sub">是否真正遵循目标条件。</text>
</svg>
