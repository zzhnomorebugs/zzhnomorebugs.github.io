<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1780" viewBox="0 0 640 1780" role="img" aria-labelledby="title desc">
  <title id="title">BFN、DFM-abs 与 DFM-uni 的带噪输入对比</title>
  <desc id="desc">箭头表示从同一抽象干净序列构造训练时的带噪输入。BFN 将带噪消息映射为每个位点的 K 维类别概率向量，网络看到概率信念 θ。DFM-abs 将部分 token 替换为 MASK。DFM-uni 将部分 token 替换为从类别表均匀采样的随机 token，可能恰好采回原类别。两种 DFM 的网络都看到离散 token。α、β、γ、δ 为抽象类别符号。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#25766c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#213b36}
      .title{font-size:40px;font-weight:700;letter-spacing:-1px}
      .sub{font-size:30px;fill:#60756f}
      .heading{font-size:36px;font-weight:700}
      .label{font-size:30px;font-weight:600;fill:#25766c}
      .body{font-size:28px;fill:#536d65}
      .type{font-size:30px;font-weight:700}
      .token{font-family:"Cambria Math","Times New Roman",serif;fill:#213b36}
      .vector-label{font-family:"Cambria Math","Times New Roman",serif;font-weight:600;fill:#25766c}
      .ellipsis{fill:#78948e}
    </style>
  </defs>
  <rect width="640" height="1780" fill="#fff"/>

<text x="32" y="60" class="title">三种带噪输入</text>
<text x="32" y="109" class="sub">箭头表示构造训练时的带噪输入</text>
<rect x="32" y="155" width="576" height="560" rx="14" fill="#fff" stroke="#d3e2dd" stroke-width="2"/>
<text x="64" y="206" class="heading">BFN</text>
<text x="64" y="250" class="body">带噪消息经贝叶斯更新</text>
<text x="64" y="305" class="label">干净序列</text>
<rect x="272" y="270" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="301.0" y="304.5" class="token" font-size="36" text-anchor="middle">α</text><rect x="340" y="270" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="369.0" y="304.5" class="token" font-size="36" text-anchor="middle">β</text><rect x="408" y="270" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="437.0" y="304.5" class="token" font-size="36" text-anchor="middle">γ</text><rect x="476" y="270" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="505.0" y="304.5" class="token" font-size="36" text-anchor="middle">δ</text>
<path d="M320 340 L320 389" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="354" y="378" class="body">加噪</text>
<text x="64" y="435" class="label">每个位点：K 维概率向量 θ</text>
<rect x="64" y="458" width="120" height="128" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2"/><text x="124.0" y="489" class="vector-label" font-size="30" text-anchor="middle">θ1</text><rect x="77" y="521.04" width="16" height="48.96" rx="3" fill="#25766c"/><rect x="100" y="545.52" width="16" height="24.48" rx="3" fill="#9bbdb0"/><rect x="123" y="557.76" width="16" height="12.24" rx="3" fill="#9bbdb0"/><rect x="146" y="553.68" width="16" height="16.32" rx="3" fill="#9bbdb0"/><text x="172" y="566" class="ellipsis" font-size="28" text-anchor="middle">⋮</text><rect x="194" y="458" width="120" height="128" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2"/><text x="254.0" y="489" class="vector-label" font-size="30" text-anchor="middle">θ2</text><rect x="207" y="557.76" width="16" height="12.24" rx="3" fill="#9bbdb0"/><rect x="230" y="528.52" width="16" height="41.48" rx="3" fill="#25766c"/><rect x="253" y="540.76" width="16" height="29.24" rx="3" fill="#9bbdb0"/><rect x="276" y="553.68" width="16" height="16.32" rx="3" fill="#9bbdb0"/><text x="302" y="566" class="ellipsis" font-size="28" text-anchor="middle">⋮</text><rect x="324" y="458" width="120" height="128" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2"/><text x="384.0" y="489" class="vector-label" font-size="30" text-anchor="middle">θ3</text><rect x="337" y="550.28" width="16" height="19.72" rx="3" fill="#9bbdb0"/><rect x="360" y="557.76" width="16" height="12.24" rx="3" fill="#9bbdb0"/><rect x="383" y="524.44" width="16" height="45.56" rx="3" fill="#25766c"/><rect x="406" y="546.2" width="16" height="23.799999999999997" rx="3" fill="#9bbdb0"/><text x="432" y="566" class="ellipsis" font-size="28" text-anchor="middle">⋮</text><rect x="454" y="458" width="120" height="128" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2"/><text x="514.0" y="489" class="vector-label" font-size="30" text-anchor="middle">θ4</text><rect x="467" y="550.96" width="16" height="19.040000000000003" rx="3" fill="#9bbdb0"/><rect x="490" y="541.44" width="16" height="28.56" rx="3" fill="#9bbdb0"/><rect x="513" y="555.04" width="16" height="14.96" rx="3" fill="#9bbdb0"/><rect x="536" y="527.84" width="16" height="42.16" rx="3" fill="#25766c"/><text x="562" y="566" class="ellipsis" font-size="28" text-anchor="middle">⋮</text>
<text x="64" y="628" class="body">类别：α · β · γ · δ · …</text>
<rect x="64" y="651" width="512" height="44" rx="10" fill="#eff7f4" stroke="#eff7f4" stroke-width="2"/>
<text x="320" y="683" class="type" text-anchor="middle">网络看到概率信念 θ</text>
<rect x="32" y="739" width="576" height="440" rx="14" fill="#fff" stroke="#d3e2dd" stroke-width="2"/>
<text x="64" y="789" class="heading">DFM-abs</text>
<text x="64" y="833" class="body">吸收态 / MASK</text>
<text x="64" y="888" class="label">干净序列</text>
<rect x="272" y="853" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="301.0" y="887.5" class="token" font-size="36" text-anchor="middle">α</text><rect x="340" y="853" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="369.0" y="887.5" class="token" font-size="36" text-anchor="middle">β</text><rect x="408" y="853" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="437.0" y="887.5" class="token" font-size="36" text-anchor="middle">γ</text><rect x="476" y="853" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="505.0" y="887.5" class="token" font-size="36" text-anchor="middle">δ</text>
<path d="M320 920 L320 969" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="354" y="958" class="body">加噪</text>
<rect x="64" y="995" width="120" height="62" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="124.0" y="1037.78" class="token" font-size="28" text-anchor="middle">α</text><rect x="194" y="995" width="120" height="62" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2"/><text x="254.0" y="1037.78" class="token" font-size="28" text-anchor="middle">[MASK]</text><rect x="324" y="995" width="120" height="62" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2"/><text x="384.0" y="1037.78" class="token" font-size="28" text-anchor="middle">[MASK]</text><rect x="454" y="995" width="120" height="62" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="514.0" y="1037.78" class="token" font-size="28" text-anchor="middle">δ</text>
<text x="64" y="1100" class="body">部分位点被掩码，其余 token 保留</text>
<rect x="64" y="1124" width="512" height="36" rx="10" fill="#eff7f4" stroke="#eff7f4" stroke-width="2"/>
<text x="320" y="1152" class="type" text-anchor="middle">网络看到离散 token</text>
<rect x="32" y="1203" width="576" height="440" rx="14" fill="#fff" stroke="#d3e2dd" stroke-width="2"/>
<text x="64" y="1253" class="heading">DFM-uni</text>
<text x="64" y="1297" class="body">均匀随机替换</text>
<text x="64" y="1352" class="label">干净序列</text>
<rect x="272" y="1317" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="301.0" y="1351.5" class="token" font-size="36" text-anchor="middle">α</text><rect x="340" y="1317" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="369.0" y="1351.5" class="token" font-size="36" text-anchor="middle">β</text><rect x="408" y="1317" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="437.0" y="1351.5" class="token" font-size="36" text-anchor="middle">γ</text><rect x="476" y="1317" width="58" height="50" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="505.0" y="1351.5" class="token" font-size="36" text-anchor="middle">δ</text>
<path d="M320 1384 L320 1433" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)"/>
<text x="354" y="1422" class="body">加噪</text>
<rect x="64" y="1459" width="120" height="62" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="124.0" y="1501.78" class="token" font-size="36" text-anchor="middle">α</text><rect x="194" y="1459" width="120" height="62" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2"/><text x="254.0" y="1501.78" class="token" font-size="36" text-anchor="middle">δ</text><rect x="324" y="1459" width="120" height="62" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2"/><text x="384.0" y="1501.78" class="token" font-size="36" text-anchor="middle">β</text><rect x="454" y="1459" width="120" height="62" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2"/><text x="514.0" y="1501.78" class="token" font-size="36" text-anchor="middle">δ</text>
<text x="64" y="1564" class="body">部分位点替换成随机类别</text>
<rect x="64" y="1588" width="512" height="36" rx="10" fill="#eff7f4" stroke="#eff7f4" stroke-width="2"/>
<text x="320" y="1616" class="type" text-anchor="middle">网络看到离散 token</text>
<path d="M32 1670 H608" stroke="#dce7e2" stroke-width="2"/>
<text x="32" y="1711" class="body">α、β、γ、δ 为抽象 token</text>
<text x="32" y="1753" class="body">均匀替换可能恰好采回原类别</text>
</svg>
