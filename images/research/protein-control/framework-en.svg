<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">Controllable protein sequence generation: Method overview</title>
  <desc id="desc">A general sequence prior, reference protein context, and target properties jointly support conditional sequence generation. Generated candidates undergo independent checks of condition adherence, editing behavior, and structural plausibility. No real protein sequences, model specifications, or experimental metrics are shown.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#25766c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#78948e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#213b36} .title{font-size:38px;font-weight:700;letter-spacing:-1px} .sub{font-size:23px;fill:#60756f} .label{font-size:21px;font-weight:600;fill:#25766c;letter-spacing:0.6px} .heading{font-size:29px;font-weight:700} .body{font-size:23px;fill:#536d65} .small{font-size:21px;fill:#536d65} .center{text-anchor:middle} .card{fill:#fff;stroke:#d3e2dd;stroke-width:2} .line{fill:none;stroke:#25766c;stroke-width:3;stroke-linejoin:round;stroke-linecap:round} .pill{fill:#eff7f4}
    </style>
  </defs>
  <rect width="1440" height="840" fill="#fff" />
  <text x="64" y="68" class="title">From a protein prior to candidates under target conditions</text>
  <text x="64" y="111" class="sub">Use a reference protein as context to find edits that balance sequence plausibility and target properties</text>

  <rect x="64" y="158" width="330" height="170" rx="14" class="card" />
  <rect x="64" y="158" width="8" height="170" rx="4" fill="#25766c" />
  <text x="94" y="200" class="label">GENERAL KNOWLEDGE</text>
  <text x="94" y="248" class="heading" style="font-size:24.0px">Protein sequence prior</text>
  <text x="94" y="290" class="body">Learn sequence statistics</text>

  <rect x="64" y="362" width="330" height="160" rx="14" class="card" />
  <text x="94" y="405" class="label">REFERENCE CONTEXT</text>
  <text x="94" y="453" class="heading" style="font-size:19.1px">Reference / wild-type protein</text>
  <text x="94" y="495" class="body" style="font-size:20.2px">Conditions for relative editing</text>

  <rect x="64" y="556" width="330" height="160" rx="14" class="card" />
  <text x="94" y="599" class="label">DESIGN TARGET</text>
  <text x="94" y="647" class="heading" style="font-size:18.7px">Function / property condition</text>
  <text x="94" y="689" class="body" style="font-size:21.5px">Specify the desired change</text>

  <path d="M394 242 H445 V385 H493" class="line" marker-end="url(#arrow)" />
  <path d="M394 442 H493" class="line" marker-end="url(#arrow)" />
  <path d="M394 636 H445 V499 H493" class="line" marker-end="url(#arrow)" />

  <rect x="505" y="332" width="405" height="220" rx="18" fill="#f2f8f5" stroke="#9ebdb3" stroke-width="2" />
  <text x="707.5" y="385" class="label center" style="font-size:19.9px">DISCRETE SEQUENCE GENERATION</text>
  <text x="707.5" y="435" class="heading center">Conditional generator</text>
  <text x="707.5" y="480" class="body center" style="font-size:21.3px">Combine prior, context, and condition</text>

  <path d="M910 442 H1013" class="line" marker-end="url(#arrow)" />
  <rect x="1025" y="262" width="350" height="300" rx="18" class="card" />
  <text x="1200" y="315" class="label center">GENERATED OUTPUT</text>
  <text x="1200" y="365" class="heading center" style="font-size:21.5px">Candidate protein sequences</text>
  <text x="1200" y="407" class="body center" style="font-size:20.1px">Explore reference-based variants</text>
  <g transform="translate(1081 430)">
    <rect x="0" y="0" width="238" height="28" rx="7" fill="#edf3ef" />
    <rect x="0" y="44" width="238" height="28" rx="7" fill="#edf3ef" />
    <rect x="0" y="88" width="238" height="28" rx="7" fill="#edf3ef" />
    <g fill="#a4cabb"><rect x="18" y="6" width="34" height="16" rx="4" /><rect x="66" y="6" width="34" height="16" rx="4" /><rect x="114" y="6" width="34" height="16" rx="4" /><rect x="162" y="6" width="58" height="16" rx="4" /><rect x="18" y="50" width="34" height="16" rx="4" /><rect x="66" y="50" width="34" height="16" rx="4" /><rect x="114" y="50" width="34" height="16" rx="4" /><rect x="162" y="50" width="58" height="16" rx="4" /><rect x="18" y="94" width="34" height="16" rx="4" /><rect x="66" y="94" width="34" height="16" rx="4" /><rect x="114" y="94" width="34" height="16" rx="4" /><rect x="162" y="94" width="58" height="16" rx="4" /></g>
    <g fill="#25766c"><rect x="66" y="50" width="34" height="16" rx="4" /><rect x="162" y="94" width="58" height="16" rx="4" /></g>
  </g>

  <path d="M1200 562 V593" fill="none" stroke="#78948e" stroke-width="3" marker-end="url(#arrow-muted)" />
  <rect x="1025" y="605" width="350" height="128" rx="12" fill="#eff7f4" stroke="#b8d1c7" stroke-width="2" />
  <text x="1200" y="646" class="heading center" style="font-size:27px">Independent evaluation</text>
  <text x="1200" y="680" class="small center">Condition adherence · Edits</text>
  <text x="1200" y="707" class="small center" style="font-size:18.8px">Sequence and structure plausibility</text>

  <path d="M64 756 H1375" stroke="#dce7e2" stroke-width="2" />
  <circle cx="77" cy="798" r="5" fill="#25766c" />
  <text x="97" y="806" class="sub">Generation proposes candidates; independent evaluation checks adherence to target conditions.</text>
</svg>