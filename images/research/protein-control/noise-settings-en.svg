<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="890" viewBox="0 0 1400 890" role="img" aria-labelledby="title desc">
  <title id="title">Noisy inputs for BFN, DFM-abs, and DFM-uni</title>
  <desc id="desc">Arrows construct noisy training inputs from the same abstract clean sequence. BFN maps noisy messages to a K-dimensional class probability vector at each position; the network reads probability beliefs θ. DFM-abs replaces some tokens with MASK. DFM-uni replaces some tokens with classes sampled uniformly from the vocabulary, which can include the original class. Both DFM networks read discrete tokens. α, β, γ, and δ are abstract class symbols.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#25766c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#213b36}
      .title{font-size:37px;font-weight:700;letter-spacing:-1px}
      .sub{font-size:24px;fill:#60756f}
      .heading{font-size:29px;font-weight:700}
      .label{font-size:24px;font-weight:600;fill:#25766c}
      .body{font-size:23px;fill:#536d65}
      .type{font-size:27px;font-weight:700}
      .token{font-family:"Cambria Math","Times New Roman",serif;fill:#213b36}
      .vector-label{font-family:"Cambria Math","Times New Roman",serif;font-weight:600;fill:#25766c}
      .ellipsis{fill:#78948e}
    .vector-label{font-family:"Cambria Math","Times New Roman",serif;font-style:italic;font-weight:400}</style>
  </defs>
  <rect width="1400" height="890" fill="#fff" />

<text x="50" y="62" class="title">Different noising settings, different network inputs</text>
<text x="50" y="106" class="sub">Arrows construct noisy training inputs; α, β, γ, δ are abstract tokens</text>
<text x="280" y="168" class="label" style="font-size:21.6px">Same clean sequence</text>
<text x="590" y="168" class="label">Noisy network input</text>
<text x="1110" y="168" class="label">Input state</text>
<rect x="50" y="200" width="1300" height="185" rx="14" fill="#fff" stroke="#d3e2dd" stroke-width="2" />
<text x="78" y="266" class="heading">BFN</text>
<text x="78" y="294.2" class="body"><tspan x="78" dy="0">Bayesian belief</tspan><tspan x="78" dy="27.6">update</tspan></text>
<rect x="280" y="259" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="305.0" y="296.26" class="token" font-size="32" text-anchor="middle">α</text><rect x="340" y="259" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="365.0" y="296.26" class="token" font-size="32" text-anchor="middle">β</text><rect x="400" y="259" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="425.0" y="296.26" class="token" font-size="32" text-anchor="middle">γ</text><rect x="460" y="259" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="485.0" y="296.26" class="token" font-size="32" text-anchor="middle">δ</text>
<path d="M518 286 L564 286" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)" />
<path d="M1010 286 L1071 286" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)" />
<rect x="590" y="227" width="84" height="113" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2" /><text x="632.0" y="253" class="vector-label" font-size="23" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="600" y="275.76" width="10" height="48.239999999999995" rx="3" fill="#25766c" /><rect x="615" y="299.88" width="10" height="24.119999999999997" rx="3" fill="#9bbdb0" /><rect x="630" y="311.94" width="10" height="12.059999999999999" rx="3" fill="#9bbdb0" /><rect x="645" y="307.92" width="10" height="16.08" rx="3" fill="#9bbdb0" /><text x="662" y="320" class="ellipsis" font-size="22" text-anchor="middle">⋮</text><rect x="686" y="227" width="84" height="113" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2" /><text x="728.0" y="253" class="vector-label" font-size="23" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="696" y="311.94" width="10" height="12.059999999999999" rx="3" fill="#9bbdb0" /><rect x="711" y="283.13" width="10" height="40.87" rx="3" fill="#25766c" /><rect x="726" y="295.19" width="10" height="28.81" rx="3" fill="#9bbdb0" /><rect x="741" y="307.92" width="10" height="16.08" rx="3" fill="#9bbdb0" /><text x="758" y="320" class="ellipsis" font-size="22" text-anchor="middle">⋮</text><rect x="782" y="227" width="84" height="113" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2" /><text x="824.0" y="253" class="vector-label" font-size="23" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="792" y="304.57" width="10" height="19.43" rx="3" fill="#9bbdb0" /><rect x="807" y="311.94" width="10" height="12.059999999999999" rx="3" fill="#9bbdb0" /><rect x="822" y="279.11" width="10" height="44.89" rx="3" fill="#25766c" /><rect x="837" y="300.55" width="10" height="23.45" rx="3" fill="#9bbdb0" /><text x="854" y="320" class="ellipsis" font-size="22" text-anchor="middle">⋮</text><rect x="878" y="227" width="84" height="113" rx="10" fill="#f7faf8" stroke="#c9ddd4" stroke-width="2" /><text x="920.0" y="253" class="vector-label" font-size="23" text-anchor="middle">θ<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="888" y="305.24" width="10" height="18.76" rx="3" fill="#9bbdb0" /><rect x="903" y="295.86" width="10" height="28.14" rx="3" fill="#9bbdb0" /><rect x="918" y="309.26" width="10" height="14.74" rx="3" fill="#9bbdb0" /><rect x="933" y="282.46" width="10" height="41.54" rx="3" fill="#25766c" /><text x="950" y="320" class="ellipsis" font-size="22" text-anchor="middle">⋮</text>
<text x="590" y="367" class="body">Classes: α · β · γ · δ · …</text>
<text x="1110" y="280" class="type" style="font-size:22.0px">Probability vector θ</text>
<text x="1110" y="322" class="body" style="font-size:18.1px">K dimensions per position</text>
<rect x="50" y="405" width="1300" height="185" rx="14" fill="#fff" stroke="#d3e2dd" stroke-width="2" />
<text x="78" y="471" class="heading">DFM-abs</text>
<text x="78" y="499.2" class="body"><tspan x="78" dy="0">Absorbing state /</tspan><tspan x="78" dy="27.6">MASK</tspan></text>
<rect x="280" y="464" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="305.0" y="501.26" class="token" font-size="32" text-anchor="middle">α</text><rect x="340" y="464" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="365.0" y="501.26" class="token" font-size="32" text-anchor="middle">β</text><rect x="400" y="464" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="425.0" y="501.26" class="token" font-size="32" text-anchor="middle">γ</text><rect x="460" y="464" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="485.0" y="501.26" class="token" font-size="32" text-anchor="middle">δ</text>
<path d="M518 491 L564 491" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)" />
<path d="M1010 491 L1071 491" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)" />
<rect x="590" y="464" width="90" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="635.0" y="501.26" class="token" font-size="25" text-anchor="middle">α</text><rect x="692" y="464" width="90" height="54" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2" /><text x="737.0" y="501.26" class="token" font-size="25" text-anchor="middle">[MASK]</text><rect x="794" y="464" width="90" height="54" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2" /><text x="839.0" y="501.26" class="token" font-size="25" text-anchor="middle">[MASK]</text><rect x="896" y="464" width="90" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="941.0" y="501.26" class="token" font-size="25" text-anchor="middle">δ</text>
<text x="590" y="562" class="body" style="font-size:20.2px">Mask some positions; keep the other tokens</text>
<text x="1110" y="485" class="type">Discrete tokens</text>
<text x="1110" y="527" class="body" style="font-size:19.3px">Original class or [MASK]</text>
<rect x="50" y="610" width="1300" height="185" rx="14" fill="#fff" stroke="#d3e2dd" stroke-width="2" />
<text x="78" y="676" class="heading">DFM-uni</text>
<text x="78" y="704.2" class="body"><tspan x="78" dy="0">Uniform random</tspan><tspan x="78" dy="27.6">replacement</tspan></text>
<rect x="280" y="669" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="305.0" y="706.26" class="token" font-size="32" text-anchor="middle">α</text><rect x="340" y="669" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="365.0" y="706.26" class="token" font-size="32" text-anchor="middle">β</text><rect x="400" y="669" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="425.0" y="706.26" class="token" font-size="32" text-anchor="middle">γ</text><rect x="460" y="669" width="50" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="485.0" y="706.26" class="token" font-size="32" text-anchor="middle">δ</text>
<path d="M518 696 L564 696" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)" />
<path d="M1010 696 L1071 696" fill="none" stroke="#25766c" stroke-width="3" marker-end="url(#arrow)" />
<rect x="590" y="669" width="90" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="635.0" y="706.26" class="token" font-size="32" text-anchor="middle">α</text><rect x="692" y="669" width="90" height="54" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2" /><text x="737.0" y="706.26" class="token" font-size="32" text-anchor="middle">δ</text><rect x="794" y="669" width="90" height="54" rx="10" fill="#e1f0e9" stroke="#72a899" stroke-width="2" /><text x="839.0" y="706.26" class="token" font-size="32" text-anchor="middle">β</text><rect x="896" y="669" width="90" height="54" rx="10" fill="#f1f5f2" stroke="#dce7e2" stroke-width="2" /><text x="941.0" y="706.26" class="token" font-size="32" text-anchor="middle">δ</text>
<text x="590" y="767" class="body" style="font-size:19.7px">Replace some positions with random classes</text>
<text x="1110" y="690" class="type">Discrete tokens</text>
<text x="1110" y="732" class="body" style="font-size:19.0px">Original or random class</text>
<path d="M50 823 H1350" stroke="#dce7e2" stroke-width="2" />
<text x="50" y="860" class="sub" style="font-size:22.6px">BFN: Noisy message → Bayesian update → Probability belief     DFM-uni: A random replacement can match the original class</text>
</svg>