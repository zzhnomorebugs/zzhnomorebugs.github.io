zh-CN:
  framework:
    source: 不完整训练样本
    measured: 每份实测 7 / 9 块
    split: 划分 context / query
    context: 模型只见 context
    output: 训练后预测（示意）
    pixel: 逐像素
    block: 按整块
    excluded: 无查询监督
    supported: 可获查询监督
  title: 左上角没测到，模型从哪里学会补它？
  navigation: 选择讲解阶段
  play: 播放
  pause: 暂停
  replay: 重播
  previous: 上一阶段
  next: 下一阶段
  progress: 讲解进度
  update: 更新模型参数
  legend: 图中标记
  keys: [实测场值, 'Context · 输入', 'Query · 留出实测', '预测（示意）', 数值未显示]
  scenes:
    - step: 策略对照
      phase: 方法框架
      title: 九块中只测七块，哪些划分能让左上角获得监督？
      cue: 同一批带噪观测从左侧分流。上排逐像素取样，下排按整块取样。每排依次展示划分、模型可见的 context 和训练后的预测。标记 i 供读者对照同一位置。
      outcome: 上排的 context 在七个实测块里都留下像素，所以左上角 i 永远没有查询标签。下排只保留四整块，同样的 context 形状也能来自测到了 i 的样本 B，因而 i 可获得监督。
    - step: 逐像素取样
      phase: 划分策略一 · 逐像素
      title: 七块都留下像素，空白块的位置就暴露了
      cue: 上下两行从同一批观测取样。沿上排角标数，蓝紫色像素出现在七个块，已经用完所有实测块。下排只有四块留在 context。
      outcome: 任何能留下这种 context 形状的样本都没测到 i。模型可以在 i 输出一个数，但对于这种输入，损失函数永远收不到该处的实测答案。
    - step: 按整块取样
      phase: 划分策略二 · 按整块
      title: 四块 context 的位置相同，i 却可能有答案
      cue: 上排的像素足迹仍排除左上块。沿下排看样本 A 和 B 的切换，四个蓝紫块的位置固定，其余五块中原本缺失的两块可以不同。
      outcome: 换成样本 B。蓝紫块的位置相同，里面的场值可以不同。B 在左上角测到了 i；只要这种样本和划分会出现，i 就能作为 query 参与训练。
    - step: 构造输入
      phase: 一次训练 · 输入
      title: 从样本 B 留出答案，只给 context 加噪
      left_role: 训练数据端 · 样本 B
      left: 四块作输入，三块留作答案
      right_role: 模型输入
      right: 只保留 context 的数值和位置
      right_after: 同样四块，加上时刻 t 的噪声
      action: 留出 query
      result: 加入高斯噪声
      cue: 橙框里的三块确实测过。把它们的干净数值留在损失端，另外两个原始缺口仍然没有标签。
      outcome: 模型收到扩散时间 t、带噪的四块测量和 context 掩码。右图其余五块的外观相同，模型看不到哪些会被评分。
    - step: 预测全场
      phase: 一次训练 · 前向预测
      title: 答案揭晓前，模型要先预测整幅干净场
      left_role: 模型输入 · 样本 B
      left: 带噪 context 与它的位置
      right_role: 模型输出
      right: 干净场的预测
      action: 条件预测
      result: 输出整场
      cue: 同一个模型读取这四块测量中的空间线索，给九块中的每个位置都作出预测。
      outcome: 现在 i 已经有了预测值。模型仍然看不到 i 的实测答案。下一步才用 query 掩码选出能核对的位置。
    - step: 核对与更新
      phase: 一次训练 · 查询损失
      title: 只核对三块留出的测量，用误差更新模型
      left_role: 来自模型输出
      left: 取出 query 处的预测
      right_role: 来自训练数据
      right: 揭晓相同位置的干净测量
      action: 对齐位置
      result: 计算平方误差
      cue: 把左图的预测与右图的实测按位置对齐。只有三块参与损失，其中就包括两图标记的 i。
      outcome: 三块上的平方误差通过反向传播更新模型参数。反复更换样本、划分和噪声，模型逐渐学会用可见观测估计有监督位置的场值。
    - step: 补全缺口
      phase: 训练之后 · 推理
      title: 回到样本 A，把学到的条件预测用在缺口
      left_role: 待补全的样本 A
      left: 从七块实测中抽取 context
      right_role: 重建输出
      right: 保留实测块
      right_after: 两个缺口填入估计值
      action: 抽取多个 context
      result: 平均预测
      cue: 看左图两次留下的蓝紫块，位置发生了变化。推理时，在接近零噪声的同一份观测上多次抽取 context，用训练好的模型分别预测。
      outcome: 把多次预测的均值填进两个缺口，写回原来的七块实测。左上角 i 现在有了估计值；样本 A 自身仍没有该点的真值可供核对。
en:
  framework:
    source: Incomplete samples
    measured: 7 of 9 blocks measured
    split: Context / query split
    context: Context-only input
    output: Prediction (illustrative)
    pixel: Pixel split
    block: Block split
    excluded: No query supervision
    supported: Query supervision possible
  title: Where does the model get a target for a missing location?
  navigation: Choose a stage
  play: Play
  pause: Pause
  replay: Replay
  previous: Previous stage
  next: Next stage
  progress: Walkthrough progress
  update: Update weights
  legend: Field markings
  keys: [Measured field, 'Context · input', 'Query · held out', 'Prediction (illustrative)', No value shown]
  scenes:
    - step: Compare splits
      phase: Method overview
      title: Seven of nine blocks are measured. Which split can supervise the top left?
      cue: The same noisy observations branch into a pixelwise split above and a whole-block split below. Read across each row from partition to visible context to trained prediction. The marker i tracks one location for the reader.
      outcome: The pixel context touches all seven measured blocks, so location i can never be queried with this footprint. The same four-block context footprint can also come from sample B, which measured i. This gives the block strategy a training target there.
    - step: Pixel split
      phase: Partition strategy one · pixels
      title: A trace in every measured block gives away the gaps
      cue: Both rows partition the same set of observations. Follow the upper brackets and count seven blocks with indigo pixels, accounting for all measured blocks. The lower context retains just four blocks.
      outcome: Every sample compatible with this footprint lacks a measurement at i. The model can output a value there, but this context gives the loss no target to score at i.
    - step: Block split
      phase: Partition strategy two · whole blocks
      title: The same four context locations can leave a target at i
      cue: The upper pixel footprint still rules out the top left. In the lower row, samples A and B can leave the same four indigo blocks while measuring different locations outside them.
      outcome: Switch to B. Its four indigo blocks have the same locations, though their field values can differ. B measured i. When this pattern and partition occur, i can serve as a training query.
    - step: Prepare input
      phase: One training step · input
      title: Set aside B’s targets and add noise to its context
      left_role: Training data · sample B
      left: Four input blocks, three held-out targets
      right_role: Model input
      right: Keep context values and locations
      right_after: The same four blocks, noised at time t
      action: Hold out queries
      result: Add Gaussian noise
      cue: The three amber blocks were measured. Set their clean values aside for the loss. The two original gaps still have no labels.
      outcome: The model gets diffusion time t, four noisy blocks and the context mask. The other five blocks look alike from the input side. Their scoring locations stay hidden.
    - step: Predict
      phase: One training step · forward pass
      title: Predict the entire clean field before revealing any target
      left_role: Model input · sample B
      left: Noisy context and its locations
      right_role: Model output
      right: Predicted clean field
      action: Condition on input
      result: Full-field estimate
      cue: The same model reads spatial clues from those four blocks and makes a prediction at every location in all nine blocks.
      outcome: There is now a prediction at i. Its measured value is still withheld. The query mask selects the predictions that the loss can check next.
    - step: Score & update
      phase: One training step · query loss
      title: Score the three held-out blocks and update the model
      left_role: From the model output
      left: Select predictions at queries
      right_role: From the training record
      right: Reveal matching clean measurements
      action: Match locations
      result: Squared error
      cue: Match each prediction on the left to its measurement on the right. Only three blocks enter the loss, including the marked location i.
      outcome: Squared errors on those blocks backpropagate to the model weights. Repeating this with new samples, splits and noise teaches the model to estimate field values from the available context.
    - step: Impute
      phase: After training · inference
      title: Return to A and apply the learned prediction to its gaps
      left_role: Sample A to complete
      left: Draw contexts from seven measured blocks
      right_role: Reconstruction
      right: Preserve measured blocks
      right_after: Fill both gaps with estimates
      action: Sample contexts
      result: Average predictions
      cue: Watch the indigo blocks switch between two choices. At near-zero noise, draw contexts from the same noisy observation and predict from each with the trained model.
      outcome: Fill the two gaps with the averaged predictions and restore the seven measured blocks. Location i now has an estimate. Sample A itself still has no ground truth there.
