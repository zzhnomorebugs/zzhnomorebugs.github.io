{% include base_path %}
{% assign training = site.data.protein_training[page.lang] %}
<figure class="retro-figure protein-training" id="protein-training-animation" aria-labelledby="protein-training-caption"
  data-protein-training data-play-label="{{ training.play }}" data-pause-label="{{ training.pause }}" data-replay-label="{{ training.replay }}">
  <div class="protein-training__panel">
    <div class="protein-training__steps" role="group" aria-label="{{ training.stages_label }}" data-training-controls hidden>
      {% for stage in training.stages %}
      <button type="button" data-training-jump="{{ stage.id }}" aria-controls="training-view-{{ stage.id }}">
        <span>{{ stage.name }}</span><strong>{{ stage.title }}</strong>
      </button>
      {% endfor %}
    </div>
    <div class="protein-training__views">
      {% for stage in training.stages %}
      <section class="protein-training__view" id="training-view-{{ stage.id }}" data-training-view="{{ stage.id }}" aria-label="{{ stage.name }}">
        <h4 class="protein-training__static-title">{{ stage.name }} · {{ stage.title }}</h4>
        {% assign sizes = 'desktop mobile' | split: ' ' %}
        {% for size in sizes %}
          {% assign layout_key = 'protein_training_' | append: size %}
          {% assign geometry = site.data[layout_key][stage.id] %}
          {% include protein-training-diagram.html %}
        {% endfor %}
      </section>
      {% endfor %}
    </div>
    <div class="protein-training__controls" data-training-controls hidden>
      <button type="button" data-training-play>{{ training.play }}</button>
      <input type="range" min="0" value="0" step="0.1" data-training-progress aria-label="{{ training.progress }}">
    </div>
  </div>
  <figcaption class="retro-figure__caption" id="protein-training-caption">{{ training.caption }}</figcaption>
</figure>
<script src="{{ base_path }}/assets/js/lib/d3-selection-3.0.0.min.js" defer></script>
<script src="{{ base_path }}/assets/js/lib/gsap-3.13.0.min.js" defer></script>
<script src="{{ base_path }}/assets/js/protein-training-effects.js?v={{ site.time | date: '%s' }}" defer></script>
<script src="{{ base_path }}/assets/js/protein-training-transition.js?v={{ site.time | date: '%s' }}" defer></script>
<script src="{{ base_path }}/assets/js/protein-control-training.js?v={{ site.time | date: '%s' }}" defer></script>
